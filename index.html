<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Walter 來訪 · 漢諾威週末 2026</title>
<link rel="stylesheet" href="style.css?v=1.4.10">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <div>
      <h1>🧳 Walter 來訪</h1>
      <p class="sub">11/28（六）– 11/30（一）· Hannover</p>
    </div>
    <div class="flight-badge">
      <span class="in">✈️ IN 11/28 10:20</span>
      <span class="out">✈️ OUT 11/30 18:15</span>
    </div>
  </div>
  <nav class="global-nav">
    <a href="#timeline-section" class="nav-btn active" data-target="timeline-section">📅 日曆</a>
    <a href="#map-section" class="nav-btn" data-target="map-section">🗺️ 地圖</a>
    <a href="#notes-section" class="nav-btn" data-target="notes-section">📝 筆記</a>
  </nav>
</header>

<main>
  <!-- ============ 日曆 / 行程 ============ -->
  <section id="timeline-section">
    <div class="day-tabs" role="tablist">
      <button class="day-tab active" data-day="2026-11-28">六 11/28</button>
      <button class="day-tab" data-day="2026-11-29">日 11/29</button>
      <button class="day-tab" data-day="2026-11-30">一 11/30</button>
    </div>
    <div id="timeline" class="timeline"></div>
    <p class="src-note" id="cal-updated"></p>
  </section>

  <!-- ============ 地圖 ============ -->
  <section id="map-section">
    <div class="map-head">
      <h2>🗺️ 地圖</h2>
      <button id="loc-btn" class="loc-btn">📍 我在哪裡</button>
    </div>
    <div id="map"></div>
    <div class="legend">
      <span><i class="dot" style="background:#42a5f5"></i>住宿</span>
      <span><i class="dot" style="background:#26c6a2"></i>交通</span>
      <span><i class="dot" style="background:#ff7043"></i>吃</span>
      <span><i class="dot" style="background:#ab7df6"></i>景點</span>
      <span><i class="dot" style="background:#ffee58"></i>採買</span>
    </div>
    <div class="list-head-row">
      <h3>地點列表</h3>
      <div class="list-actions">
        <button id="show-all" class="list-btn">全部顯示</button>
        <button id="hide-all" class="list-btn">全部隱藏</button>
      </div>
    </div>
    <ul id="place-list"></ul>
  </section>

    <section id="notes-section" class="notes-section">
    <h2>📝 筆記</h2>
    <div class="notes-tools">
      <span id="notes-status" class="notes-status"></span>
      <button id="notes-copy" class="notes-btn">複製全部</button>
    </div>
    <textarea id="notes-area" placeholder="自由記錄：採買清單、約定事項、想到什麼寫什麼…&#10;（只存在這台手機的瀏覽器裡，不同裝置不同步）"></textarea>
  </section>
  <footer>
    <p>Boyo &amp; Walter · Hannover · 資料來源：walter-visit-2026-11-28 公開日曆</p>
    <p class="version">v1.4.10</p>
  
  </footer>
</main>


<!-- event detail modal -->
<div id="ev-modal" hidden>
  <div class="ev-modal-card">
    <button id="ev-modal-close" aria-label="關閉">✕</button>
    <div id="ev-modal-body"></div>
  </div>
</div>

<script src="app.js?v=1.4.10"></script>
<script async defer
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCrWPvsA_SU08rkUhOIVdafZwzAwHbM9aE&loading=async&callback=initMap&language=zh-TW&region=DE">
</script>

</body>
</html>
