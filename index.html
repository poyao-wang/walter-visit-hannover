<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Walter 來訪 · 漢諾威週末 2026</title>
<link rel="stylesheet" href="style.css?v=1.2.4">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<header class="topbar">
  <div>
    <h1>🧳 Walter 來訪</h1>
    <p class="sub">11/28（六）– 11/30（一）· Hannover</p>
  </div>
  <div class="flight-badge">
    <span class="in">✈️ IN 11/28 10:20</span>
    <span class="out">✈️ OUT 11/30 18:15</span>
  </div>
</header>

<main>
  <!-- ============ 日曆 / 行程 ============ -->
  <section id="timeline-section">
    <div class="day-tabs" role="tablist">
      <button class="day-tab active" data-day="2026-11-28">六 11/28</button>
      <button class="day-tab" data-day="2026-11-29">日 11/29</button>
      <button class="day-tab" data-day="2026-11-30">一 11/30</button>
    </div>
    <div id="timeline" class="timeline"></div>
    <p class="src-note" id="cal-updated"></p>
  </section>

  <!-- ============ 地圖 ============ -->
  <section id="map-section">
    <div class="map-head">
      <h2>🗺️ 地圖</h2>
      <button id="loc-btn" class="loc-btn">📍 我在哪裡</button>
    </div>
    <div id="map"></div>
    <div class="legend">
      <span><i class="dot anchor"></i>定案</span>
      <span><i class="dot option"></i>備選</span>
      <span><i class="dot info"></i>航班</span>
    </div>
    <div class="list-head-row">
      <h3>地點列表</h3>
      <div class="list-actions">
        <button id="show-all" class="list-btn">全部顯示</button>
        <button id="hide-all" class="list-btn">全部隱藏</button>
      </div>
    </div>
    <ul id="place-list"></ul>
  </section>

  <footer>
    <p>Boyo &amp; Walter · Hannover · 資料來源：walter-visit-2026-11-28 公開日曆</p>
    <p class="version">v1.2.2</p>
  </footer>
</main>

<script src="app.js?v=1.2.4"></script>
<script async defer
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCrWPvsA_SU08rkUhOIVdafZwzAwHbM9aE&loading=async&callback=initMap&language=zh-TW&region=DE">
</script>
</body>
</html>
